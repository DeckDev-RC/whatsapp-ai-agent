version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - whatsapp-internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - backend-auth:/app/auth_info_baileys
      - backend-uploads:/app/uploads
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - whatsapp-internal

networks:
  whatsapp-internal:
    driver: bridge

volumes:
  backend-auth:
  backend-uploads:
